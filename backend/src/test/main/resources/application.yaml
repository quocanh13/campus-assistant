spring:
    datasource:
        url: ${MYSQL_URL}
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
        driver-class-name: ${MYSQL_DRIVER}
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
    servlet:
        multipart:
            max-file-size: 100MB
            max-request-size: 120MB
logging:
    file:
        name: application.log
    level:
        root: INFO
    pattern:
        console: "%d{HH:mm:ss.SSS} %-5level [%-25logger{0}] - %msg%n"
    logback:
        rollingpolicy:
            max-file-size: 10MB
            max-history: 30
            total-size-cap: 1GB
document:
    allowed-type:
        - application/pdf
        - text/plain
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/msword

services:
    s3:
        endpoint: ${S3_ENDPOINT}
        access-key: ${S3_ROOT_USER}
        secret-key: ${S3_ROOT_PASSWORD}
        bucket: campus-policy
        region: us-east-1

    rag:
        base-url: ${RAG_ENDPOINT}

jwt:
    secret: ${JWT_SECRET}
    expiration: 10000000000
   